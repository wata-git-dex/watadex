name: Sync Notion → WATADEX

on:
  workflow_dispatch:           # run manually from Actions tab
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from Notion and update index.html
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node fetch-notion.mjs

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name  "notion-sync-bot"
            git config user.email "actions@github.com"
            git add index.html
            git commit -m "Sync Notion data [skip ci]"
            git push
          else
            echo "No changes — Notion data matches baked data."
          fi
