eatments don't address on their own."}],evolvesFrom:"Carbona",evolvesTo:null},{dex:100,name:"Agua",category:"Legendary",family:"Legendary",hp:130,atk:110,habitat:["Shrine"],stage:null,desc:"A phoenix of flowing water - large wings, water-flame crest, a droplet emblem on its chest. Not tied to any single region; represents the origin of clean water itself. GROWTH ARC: starts as a small, pale blue hatchling egg-form, color deepens and lightens across each Form as the player progresses - culminating in a Final Form that is fully white: ancient, elegant, luminous.",simple:"Agua is the very first clean water spirit - not from any one place, but the idea of clean water itself.",wash:"The origin/universal concept of clean water, not tied to one region's specific challenge.",why:"Represents the shared goal underneath every region's specific story: safe water for everyone.",how:null,weakTo:"N/A - legendary reveal creature, not a direct battle counter",resistTo:"N/A - legendary reveal creature, not a direct battle counter",status:"Draft",acceptability:null,primaryVulnerability:null,titanPassive:null,unlockCondition:"NOT an end-game catch. Given to the player as an EGG at the very start of the game and grows in parallel with the whole story. The Final Form - the full Wata Phoenix - is only reached if raised correctly across the whole game, alongside clearing all 6 regions and awakening all 5 Titans.",moves:[{name:"Purity Cascade",tier:"Strong",simple:"Agua's strongest move - it purifies everything at once.",desc:"Agua's ultimate move - a total purification wave representing every real barrier succeeding at once."},{name:"Wellspring Rebirth",tier:"Basic",simple:"Agua heals with clean, flowing water.",desc:"A cleansing wave that revives and restores."}],evolvesFrom:null,evolvesTo:null},{dex:101,name:"Quetzumal",category:"Legendary",family:"Legendary",hp:115,atk:100,habitat:["Mountain","Shrine"],stage:null,desc:"A storm quetzal with Maya geometric patterns, cloud and lightning mo sh:"Groundwater - naturally filtered by soil, but vulnerable to dissolved minerals/metals.",why:"Groundwater is naturally filtered as it seeps through layers of soil and rock. But that same rock can dissolve metals - arsenic, iron, fluoride - directly into the water, invisibly. A well can look and taste perfectly fine and still be unsafe.",how:null,weakTo:null,resistTo:null,status:"Draft",acceptability:null,primaryVulnerability:"Metal",titanPassive:"Passive Effect (Deep Draw): Acceptability +5 each turn if Metal is not present.",unlockCondition:"Awakens once ALL 6 Field Regions are cleared \u2014 every region relies on groundwater/wells.",moves:[],evolvesFrom:null,evolvesTo:null},{dex:112,name:"Wellara",category:"Titan",family:"Well Water",hp:105,atk:105,habitat:["Mountain","Shrine"],stage:null,desc:"A well spirit shaped by the rope and bucket - open, humble, and exposed. Represents the shallow, hand-dug wells millions of households rely on day to day.",simple:"Wellara is the spirit of the open well - the kind you lower a bucket into. It's a good source, but easy to make dirty if you're not careful at the top.",wash:"Open, shallow, hand-dug wells - highly vulnerable to contamination from surface runoff, buckets, and animals.",why:"An open, hand-dug well is only as safe as everything that touches it. Because the opening isn't sealed like a proper borehole, bacteria from dirty hands, animals, or surface runoff keeps getting reintroduced.",how:null,weakTo:null,resistTo:null,status:"Draft",acceptability:null,primaryVulnerability:"Bacteria",titanPassive:"Passive Effect (Bucket Guard): Acceptability +5 each turn if no new Bacteria or Sediment card entered this turn.",unlockCondition:"Awakens once Pearl Coast (Myanmar), Maize Highlands (Guatemala), AND Ember Cliffs (El Salvador) are all cleared.",moves:[],evolvesFrom:null,evolvesTo:null},{dex:113,name:"Nimbaqua",category:"Titan",family:"Rainwater",hp:95,atk:95,habitat:["Town"],stage:null,desc:"A rain spirit - naturally clean water that becomes contaminated mainly through dirty collection surfaces and storage.",simple:"Nimbaqua is the spirit of rain - clean when it falls, but only as clean as what catches and stores it.",wash:"Rainwater - naturally clean at the source; contamination usually comes from collection/storage.",why:"Rain falling from the sky is about as clean as water gets at the source. Stored in open or poorly sealed containers exposed to sunlight, algae can bloom fast, turning stored rainwater green, smelly, and undrinkable within days.",how:null,weakTo:null,resistTo:null,status:"Draft",acceptability:null,primaryVulnerability:"Algae",titanPassive:"Passive Effect (Clean Fall): Acceptability +5 each turn if Algae is not present (in storage).",unlockCondition:"Awakens once Emerald Terraces, Maize Highlands, Pearl Coast, Refuge Hillsides, AND Amber Desert are all cleared.",moves:[],evolvesFrom:null,evolvesTo:null},{dex:114,name:"Torpalis",category:"Titan",family:"Stagnant Water",hp:90,atk:90,habitat:["Wetland"],stage:null,desc:"A still-pond spirit - standing water that doesn't flow, making it the highest-risk source overall.",simple:"Torpalis is the spirit of still ponds - the highest-risk water source, since nothing is flowing to clean it.",wash:"Stagnant water - standing water with no flow, the highest-risk source type overall.",why:"Standing water with no flow is the highest-risk water source type. Guinea worm disease specifically depends on stagnant water: its intermediate host, a tiny water flea, can only survive in still ponds. This is one of the rare real cases where there's no medical cure once infected.",how:null,weakTo:null,resistTo:null,status:"Draft",acceptability:null,primaryVulnerability:"Worms",titanPassive:"Passive Effect (Still Water): Acceptability +5 each turn if Worms is not present.",unlockCondition:"Awakens once Emerald Terraces (Vietnam), Pearl Coast (Myanmar), AND Refuge Hillsides (Thailand) are all cleared.",moves:[],evolvesFrom:null,evolvesTo:null}],pA=[{id:1,name:"Closed Storage",practiceType:"Closed Container",hwtsStage:"Storage",desc:"Once sealed, stored water is protected from hands, dust, and dirt getting in.",simple:"A tight lid on your water container keeps dust, bugs, and dirty hands out.",wash:"Safe storage - a dedicated, covered, narrow-mouth container for treated water.",why:"Most recontamination happens after treatment, during storage - a sealed container is often the single highest-value, lowest-cost intervention in the whole treatment chain.",strongAgainst:["Bacteria","Sediment"],ineffective:["Metal","Virus","Algae"],status:"Finalized"},{id:2,name:"Hand Washing",practiceType:"Hand Washing",hwtsStage:"Use & Hygiene",desc:"Washing hands with soap before handling water or food breaks the fecal-oral transmission cycle.",simple:"Washing your hands with soap before touching water or food stops germs from spreading.",wash:"Handwashing with soap at critical times - one of the most cost-effective public health interventions that exists.",why:"Even perfectly treated water can be recontaminated by dirty hands - handwashing breaks this pathway independent of any water treatment step.",strongAgainst:["Bacteria","Worms"],ineffective:["Metal","Virus","Algae","Radiation","Sediment"],status:"Draft"},{id:3,name:"Physical Barrier",practiceType:"Physical Barrier",hwtsStage:"Collection",desc:"Fencing or barriers placed around a well, spring, or lake access point to keep animals and runoff out.",simple:"A fence around a well or spring keeps animals and runoff from getting in.",wash:"Source protection - physically fencing off a water source from animals and runoff.",why:"Protection starts before treatment even begins - keeping contamination out of the source is always cheaper and more effective than removing it afterward.",strongAgainst:["Bacteria","Sediment"],ineffective:["Metal","Virus","Algae","Radiation"],status:"Draft"},{id:4,name:"Piped Delivery",practiceType:"Piped Delivery",hwtsStage:"Collection",desc:"Water delivered through enclosed pipes never touches open air, hands, or containers until it reaches the tap.",simple:"Water that travels through closed pipes never gets touched or exposed along the way.",wash:"Piped water distribution - avoids the open transport/handling step that untreated carrying methods require.",why:"A lot of recontamination happens between the source and the home, during carrying and pouring - piped delivery removes that entire risk window.",strongAgainst:["Bacteria","Sediment","Worms"],ineffective:["Metal","Radiation"],status:"Draft"},{id:5,name:"Source Cover",practiceType:"Source Cover",hwtsStage:"Collection",desc:"A cap, cover, or sealed casing over a well, spring, or borehole keeps contamination from entering the source itself.",simple:"Capping a well or spring keeps dirt, animals, and runoff from getting into the water itself.",wash:"Sealed well caps and spring boxes that physically cover the water source at its origin point.",why:"Distinct from Physical Barrier (which keeps animals away from the area) - this seals the actual opening of the source itself, the most direct possible protection point.",strongAgainst:["Bacteria","Sediment","Worms"],ineffective:["Metal","Radiation","Virus"],status:"Draft"},{id:6,name:"Tap System",practiceType:"Tap System",hwtsStage:"Storage",desc:"A simple tap prevents dipping and keeps the water cleaner.",simple:"A tap lets you pour water out without ever dipping a cup or hand in.",wash:"Narrow-mouth, tap-dispensed safe storage design.",why:"Container design is itself a WASH intervention - a tap physically prevents the single most common recontamination behavior: dipping a hand or shared cup into stored water.",strongAgainst:["Bacteria","Sediment"],ineffective:["Metal","Virus","Algae"],status:"Finalized"}],hA=[{id:1,name:"Comal\xE1n",region:"Maize Highlands",townType:"Field Town",waterSource:"Groundwater/Well",presence:"Active",status:"Draft",realBasis:"Comalapa, Guatemala",notes:"Primary water source tentative - confirm against actual field data."},{id:2,name:"Dienvale",region:"Emerald Terraces",townType:"Field Town",waterSource:"Rainwater",presence:"Active",status:"Draft",realBasis:"Dien Bien, Vietnam",notes:"One of 3 real Vietnam field towns."},{id:3,name:"Hanori",region:"Emerald Terraces",townType:"Field Town",waterSource:"Groundwater/Well",presence:"Active",status:"Draft",realBasis:"Hanoi, Vietnam",notes:"One of 3 real Vietnam field towns."},{id:4,name:"Krungtep Hub",region:"Refuge Hillsides",townType:"Logistics Hub",waterSource:null,presence:"Active",status:"Draft",realBasis:"Bangkok, Thailand",notes:"Logistics/staging point, not a beneficiary field town itself."},{id:5,name:"Mae Sarai",region:"Refuge Hillsides",townType:"Field Town",waterSource:"River",presence:"Active",status:"Draft",realBasis:"Mae Sariang, Thailand",notes:"Primary Thailand field town."},{id:6,name:"Maeraya Camp",region:"Refuge Hillsides",townType:"Camp/Special Site",waterSource:null,presence:"Active",status:"Draft",realBasis:null,notes:"SENSITIVE SITE \u2014 real refugee camp. Name deliberately generalized. Real-world basis withheld pending user review before any public-facing use."},{id:7,name:"Ngwesana",region:"Pearl Coast",townType:"Field Town",waterSource:"Coastal/Saltwater",presence:"Active",status:"Draft",realBasis:"Ngwe Saung, Myanmar",notes:"One of 2 real Myanmar field towns."},{id:8,name:"Perlita",region:"Ember Cliffs",townType:"Field Town",waterSource:"Coastal/Saltwater",presence:"Active",status:"Draft",realBasis:"La Perla, El Salvador",notes:"Water source tentative - confirm against actual field data."},{id:9,name:"Quang N\xF4m",region:"Emerald Terraces",townType:"Field Town",waterSource:"River",presence:"Active",status:"Draft",realBasis:"Quang Nam, Vietnam",notes:"One of 3 real Vietnam field towns."},{id:10,name:"Sinmara",region:"Pearl Coast",townType:"Field Town",waterSource:"Groundwater/Well",presence:"Active",status:"Draft",realBasis:"Sinma, Myanmar",notes:"One of 2 real Myanmar field towns."}],gA={SCK:{code:"SCK",name:"Sick",color:"#2E9E5B",damageType:"HP Loss",perTurn:5,duration:3,escalates:!1,defaultChance:30,desc:"A lingering infection sets in, draining a small amount of HP each turn.",washBasis:"General infection onset \u2014 bacteria, viruses, parasites and worms all cause a lingering illness that drains the body over several days."},DHY:{code:"DHY",name:"Dehydrated",color:"#E8792E",damageType:"HP Loss",perTurn:8,duration:3,escalates:!1,defaultChance:30,desc:"Severe, acute fluid loss \u2014 drains more HP per turn than Sick, but doesn't escalate.",washBasis:"Cholera's real danger isn't the bacteria itself \u2014 it's severe watery diarrhea causing rapid, life-threatening dehydration within hours."},TOX:{code:"TOX",name:"Toxic",color:"#8E44AD",damageType:"HP Loss",perTurn:5,duration:3,escalates:!0,defaultChance:30,desc:"A toxic buildup that gets WORSE each turn (5 HP, then 10, then 15).",washBasis:"Heavy-metal, radiological or cyanotoxin exposure is cumulative \u2014 prolonged exposure genuinely gets more dangerous over time."},RAD:{code:"RAD",name:"Radiated",color:"#6D4AA8",damageType:"HP Loss",perTurn:5,duration:3,escalates:!0,defaultChance:30,desc:"Cumulative radiological exposure \u2014 escalates like Toxic, kept separate since radiation is a genuinely different real hazard.",washBasis:"Naturally occurring radioactive elements (radon, uranium) in groundwater \u2014 invisible, tasteless, with real long-term cancer risk."},MUR:{code:"MUR",name:"Murky",color:"#7A5C3A",damageType:"Acceptability Loss",perTurn:-15,duration:2,escalates:!1,defaultChance:30,desc:"Does NOT touch HP \u2014 instead drops Acceptability each turn. The danger here is rejection, not damage.",washBasis:"Sediment, algae, oil or salinity make water look, smell or taste wrong. Even when technically safe, communities often reject it and go back to a worse source."},SAL:{code:"SAL",name:"Salty",color:"#C79A3A",damageType:"Acceptability Loss",perTurn:-15,duration:2,escalates:!1,defaultChance:30,desc:"Water becomes progressively too salty to drink or use \u2014 an acceptability problem with, at household level, often no real fix.",washBasis:"Saltwater intrusion into coastal aquifers \u2014 one of the few contamination types with no standard household-level fix."}},_s=[{id:1,name:"Bucket Lid",itemType:"Safe Storage",desc:"A simple, well-fitted lid that seals a storage container from dust, insects, and dirty hands.",wash:"Covering treated water storage to block recontamination pathways.",why:"A huge share of real-world recontamination happens AFTER water is treated, during storage - a lid is often the single highest-value, lowest-cost intervention in the entire treatment chain.",how:"Placed on any household storage container after treatment - the single cheapest, most effective step to prevent recontamination.",legacy:"Formerly Liddler, Protection creature, Engine v1.5 #39"},{id:2,name:"Handwashing Station",itemType:"Hygiene",desc:"A simple handwashing setup - a tippy-tap, basin, or station with soap placed near water collection and food preparation points.",wash:"Handwashing with soap at critical times.",why:"Even perfectly treated water can be recontaminated by dirty hands dipping into storage - handwashing breaks this transmission pathway and is one of the most cost-effective public health interventions that exists.",how:"Placed at key points (near the latrine, before food prep, after handling storage containers) and used before touching stored water or its containers.",legacy:"Formerly Handiguard, Protection creature, Engine v1.5 #40"},{id:3,name:"Pour-Safe Spout",itemType:"Safe Transport",desc:"A narrow-spouted pitcher or container designed so water pours out without needing to dip a cup or hand inside.",wash:"Preventing contamination during pouring/transfer.",why:"Teaches that the moment of transfer - not just storage itself - is a recontamination risk point, and simple container design choices can eliminate it.",how:"Used to transfer treated water from a storage container to a drinking cup without contact.",legacy:"Formerly Pipepure, Protection creature, Engine v1.5 #41"},{id:4,name:"Storage Tap",itemType:"Safe Storage",desc:"A tap or spigot fitted to a storage container so water is dispensed without dipping a cup or hand inside.",wash:"Narrow-mouth, tap-dispensed safe storage design.",why:"Container design is itself a WASH intervention - a narrow opening with a tap physically prevents the single most common recontamination behavior: dipping a hand or shared cup into stored water.",how:"Fitted to a safe storage container as the sole point of access, ensuring water is only ever dispensed, never scooped.",legacy:"Formerly Taptide, Protection creature, Engine v1.5 #42"},{id:5,name:"Safe Storage Jar",itemType:"Safe Storage",desc:"A basic sealed jar or jerrycan reserved specifically for treated water, separate from any other household use.",wash:"Dedicated, sealed, opaque storage for treated water. Per CAWST's own safe-storage criteria, a good container is: tight-fitting lid, easy to clean, has a tap or narrow opening (no dipping hands/cups), is NOT transparent, and has a stable base.",why:"Reinforces that storage containers should be dedicated to treated water only, not repurposed from other household uses. The opacity requirement connects directly to the Algae family in this Watadex: a transparent container lets sunlight in, and sunlight is exactly what Greenbloom and its relatives need to grow - so an opaque container is itself a real defense against in-storage algae growth, not just a container preference.",how:"Filled with treated water immediately after treatment and kept sealed until dispensed.",legacy:"Formerly Safejar, Protection creature, Engine v1.5 #43"},{id:6,name:"Sealed Storage Vault",itemType:"Safe Storage",desc:"A hardened, fully sealed storage vault with stricter access rules, protecting treated water from hands, cups, dust, and animals alike.",wash:"Higher-security safe storage for shared/community water points.",why:"Shows that safe storage requirements scale with how many people share a water point - a single household jar and a community-scale storage system need different levels of protection.",how:"Used in households or community points where safe storage needs to be enforced more strictly - schools, clinics, or shared community taps.",legacy:"Formerly Sealvault, Protection creature, Engine v1.5 #44 (upgraded form of Safe Storage Jar)"},{id:7,name:"Source Fencing",itemType:"Source Protection",desc:"Simple fencing or barriers placed around wells, springs, or lake access points to keep animals away.",wash:"Protecting the water source itself from animal and runoff contamination.",why:"Reinforces that protection starts before treatment even begins - keeping contamination out of the source is always cheaper and more effective than removing it afterward.",how:"Installed around a water source itself, before any treatment ever happens - the earliest possible point of protection.",legacy:"Formerly Fencifin, Protection creature, Engine v1.5 #45"},{id:8,name:"Backflush Syringe",itemType:"Maintenance",desc:"The plastic squeeze syringe that ships with popular hollow-fiber membrane filters (the kind used on Sawyer-style filters, among others) - you push clean water backward through the fibers to knock trapped particles loose.",wash:"The literal maintenance accessory that ships with real hollow-fiber membrane filters - not a generic concept, a specific physical tool people actually hold and use.",why:"Filters aren't 'install and forget' - without maintenance like backwashing, membrane and biosand filters clog and lose effectiveness over time. But per CAWST's own guidance, backwashing has a real trade-off: repeated backwashing can cause the hollow fibers to rupture from fouling, and a ruptured membrane can keep passing water while silently failing to remove pathogens - a failure a user won't notice without testing. Teaches that maintenance itself carries a risk if overdone or done carelessly.",how:"Draw clean water into the syringe and push it backward through the filter's intake, done regularly (not excessively - see the rupture risk note on the Fiberflume line) to restore flow rate.",legacy:null},{id:9,name:"Dosing Syringe",itemType:"Dosing/Testing",desc:"A precise measuring syringe or dosing device used to add exactly the right amount of chlorine to a given volume of water.",wash:"Accurate chlorine dosing - too little under-treats, too much causes taste/safety issues of its own.",why:"Chlorination is dose-dependent: under-dosing leaves pathogens alive (especially in turbid water, which consumes more chlorine), while over-dosing wastes chlorine and creates taste/odor rejection. Precise dosing tools teach why 'more is always better' is false in real WASH practice.",how:"Used alongside Chemical-family treatment to measure accurate chlorine dose relative to water volume and turbidity level.",legacy:null},{id:10,name:"Ceramic Filter Brush",itemType:"Maintenance",desc:"A stiff-bristled brush used to gently scrub the outside of a ceramic pot filter's element, removing the clogged biofilm layer that builds up over weeks of use.",wash:"The real cleaning accessory used to maintain ceramic pot filters like the Filtron/Ecofiltro-style designs.",why:"Ceramic filters slow down and eventually stop working well if the clogged surface layer is never cleaned - this is a real, common maintenance failure point in household ceramic filter programs, and a simple brush is the fix.",how:"Used periodically (not daily) to gently scrub the outer surface of the ceramic element when flow rate has visibly slowed, then rinsed before returning to use.",legacy:"New - literal maintenance accessory for ceramic pot filters"},{id:11,name:"Solar Disinfection Indicator",itemType:"Dosing/Testing",desc:"A small strip or gauge placed alongside a SODIS bottle in the sun; it changes color or reading once the water has received enough UV exposure to be considered disinfected.",wash:"A device that measures whether a SODIS bottle actually received enough UV dose to be disinfected, rather than relying on guessing based on time or weather.",why:`SODIS's biggest real-world weakness is that people can't tell by looking whether the dose was sufficient - cloud cover, bottle placement, and water clarity all change how much UV actually got through. An indicator turns a guess into a measurement, directly supporting CAWST's "Correct use" principle.`,how:"Placed next to or attached to a SODIS bottle during solar disinfection; checked at the end of exposure to confirm the UV dose was sufficient before drinking.",legacy:"New - modeled on real UV-dose indicator devices used alongside SODIS in some WASH programs (exact product/brand should be verified against current CAWST-recommended options before finalizing - this is a category of tool, not a confirmed specific product name)"},{id:12,name:"Water Test Kit",itemType:"Ambassador Tool",desc:"A field water-testing kit that checks a water sample for specific contaminants before choosing a treatment or exploring a region further.",wash:"Water quality testing - checking a sample for specific contaminants (bacteria, turbidity, arsenic, etc.) using field test kits.",why:"Real treatment selection should be based on what's actually in the water, not assumption - testing is how you know whether you need a Bacteria-focused response, a Metal-focused response, or something else entirely, before committing resources to the wrong fix.",how:null,legacy:"New - separated out from Household Survey, which was originally (incorrectly) doing this job"},{id:13,name:"WATA Deck",itemType:"Ambassador Tool",desc:"A field reference deck carried by Ambassadors and players, packed with deeper educational info on any contaminant or treatment they encounter.",wash:"An educational reference tool, not a treatment or contaminant counter.",why:"Represents W.A.T.A.'s actual educational mission directly inside the game - a tool whose entire purpose is teaching, not battling.",how:null,legacy:"New - meta-tier tool, not a battle stat item"},{id:14,name:"Household Survey",itemType:"Ambassador Tool",desc:"A simple household water/health survey used to check on a family's water safety practices, health outcomes, and treatment adoption over time - not what's in the water, but whether people are actually using safe practices and whether it's working.",wash:"A real household water/sanitation survey - the kind of monitoring & evaluation tool CAWST and similar orgs use to assess program impact.",why:"Represents a real and important WASH practice: measuring outcomes and behavior change, not just installing technology. Ties directly to the real reason nonprofits collect this data - it builds trust with communities AND proves impact to donors.",how:null,legacy:"New - meta-tier tool, depends on Towns & Regions existing"},{id:15,name:"Fuel Supply",itemType:"Maintenance",desc:"A proper supply of dry firewood (or charcoal, gas, or other fuel), enough to keep a fire hot and burning long enough to bring water to a full rolling boil.",wash:"Firewood, charcoal, gas, or other fuel needed to sustain a full rolling boil.",why:"Fuel scarcity is one of the real, documented reasons boiling isn't used consistently in many communities - it costs money, time to gather, and contributes to deforestation/smoke exposure. This ties boiling's effectiveness directly to a real resource constraint instead of treating it as free.",how:"Gathered or purchased before boiling; a real, recurring cost and effort in many communities, which is exactly why boiling isn't always the easiest option even though it's very effective.",legacy:"New - represents the real fuel requirement/cost of boiling, a genuine barrier CAWST's own material notes"}],xA=[{name:"Ember Cliffs",env:"Coastal",inspiration:"El Salvador",fictional:!1,waterSource:["Coastal/Saltwater","Groundwater/Well"],challenge:"E. coli and sediment/dirt in water sources \u2014 signature contaminant family not yet decided. Possible arsenic was mentioned but is explicitly UNCONFIRMED, and shouldn't be treated as fact until verified.",signature:null,culture:"Coastal community where many lack access to basic safe water and rely on purchased bottled water. E. coli and sediment/dirt commonly present. Stylized, not a literal depiction of any real town \u2014 details from informal field knowledge, to be refined with real research.",status:"Concept",titan:"Olaserp",desc:"A volcanic coastal region of cliffs and hills, home to Olaserp, the Pacific Wave Serpent. Inspired by coastal El Salvador."},{name:"Emerald Terraces",env:"Mountain",inspiration:"Vietnam",fictional:!1,waterSource:["River","Rainwater","Groundwater/Well"],challenge:"Bacteria/E. coli contamination in natural jungle water sources (ponds, rivers) used for drinking.",signature:"Bacteria",culture:"Rice terrace farming communities in a highland setting. Many families rely on natural jungle water sources for drinking, contaminated with E. coli/bacteria, alongside heavy reliance on purchased bottled water (a real plastic pollution burden). Stylized, not a literal depiction of any real town.",status:"Concept",titan:"Song Long",desc:"A highland region of rice terraces and hillsides, home to Song Long, the Twin River Dragons. Inspired by Vietnam's Central Highlands."},{name:"Tarpoint Isle",env:"Coastal",inspiration:null,fictional:!0,waterSource:["Coastal/Saltwater"],challenge:"Petroleum/fuel contamination from shipping and industrial activity, persistent enough to define the island's water problem.",signature:"Oil",culture:"A fictional location, not inspired by any real W.A.T.A. site \u2014 built to give Oil a proper home as a signature issue, since in the real field data it showed up as a minor cross-cutting sign in Vietnam/Myanmar rather than a defining problem anywhere.",status:"Concept",titan:null,desc:"A small port and shipping island with a history of fuel spills and poor industrial waste handling, where local waters carry a persistent oily sheen."},{name:"Glowstone Isle",env:"Mountain",inspiration:null,fictional:!0,waterSource:["Groundwater/Well"],challenge:"Naturally occurring radiological contamination in deep groundwater, caused by unusual local bedrock geology.",signature:"Radiation",culture:"A fictional location, not inspired by any real W.A.T.A. site \u2014 built specifically to give Radiation a home, since none of the 6 real regions currently have documented radiological contamination.",status:"Concept",titan:null,desc:"A remote, sparsely inhabited island sitting on unusual bedrock geology, where groundwater carries naturally occurring radioactive minerals."},{name:"Maize Highlands",env:"Mountain",inspiration:"Guatemala",fictional:!1,waterSource:["Spring","Groundwater/Well","Rainwater"],challenge:"E. coli in natural/tapped water sources, with visible algae and turbidity/mineral content also present \u2014 signature family not yet decided (Bacteria/Algae/Sediment are all candidates).",signature:null,culture:"A more built-out town setting than Emerald Terraces, with some water trucks and grocery-store bottled water access. No formal water testing done yet to confirm the full picture. Stylized, not a literal depiction of any real town.",status:"Concept",titan:"Quetzumal",desc:"A mountain highland region built around maize farming, home to Quetzumal, the Storm Quetzal. Inspired by Guatemala's highlands."},{name:"Pearl Coast",env:"Coastal",inspiration:"Myanmar",fictional:!1,waterSource:["Coastal/Saltwater","Rainwater","Groundwater/Well"],challenge:"E. coli in local river water (poverty-driven, limited access to clean alternatives) \u2014 signature family not yet decided. An oil sheen has been observed but is a cross-region issue, not distinctive to this region.",signature:null,culture:"Coastal beach communities facing poverty-driven water access issues \u2014 people buy bottled water or drink local river water, often heavily contaminated. Stylized, not a literal depiction of any real town.",status:"Concept",titan:"Raya Thazin",desc:"A coastal region of beautiful beaches, home to Raya Thazin, the Ocean Spirit Manta. Inspired by coastal Myanmar."},{name:"Amber Desert",env:"Desert",inspiration:"Colombia",fictional:!1,waterSource:["Groundwater/Well"],challenge:"Water scarcity (desert, dried-up sources) combined with mining-driven metal contamination \u2014 a strong real-world basis for Metal as this region's defining issue, though exact specifics need testing.",signature:"Metal",culture:"Desert region with severe water scarcity \u2014 many natural sources have dried up, forcing people to buy water or go without. Significant real mining activity (coal mining is well-documented in La Guajira) is a major pollution source. Stylized, not a literal depiction of any real town.",status:"Concept",titan:"Wayur\xE1",desc:"A desert region, home to Wayur\xE1, the Desert Wind Spirit. Inspired by La Guajira, Colombia."},{name:"Refuge Hillsides",env:"Mountain",inspiration:"Thailand",fictional:!1,waterSource:["River","Groundwater/Well","Rainwater"],challenge:null,signature:null,culture:"Northern hillside communities, including refugee camp settings \u2014 stylized, not a literal depiction of any real place. This region carries real weight given the refugee camp context; handle with care in tone and story.",status:"Concept",titan:"Nakharin",desc:"A northern hillside region, including refugee camp communities, home to Nakharin, the Royal Naga. Inspired by northern Thailand."}];var Xu="1.1",yA="2026-07-28",mi={Contamination:{color:"#E8792E",light:"#F7A85E",glow:"rgba(232,121,46,0.28)",icon:ni,label:"Contamination"},Treatment:{color:"#1FA6D9",light:"#5FC4E8",glow:"rgba(31,166,217,0.28)",icon:Zo,label:"Treatment"},Legendary:{color:"#C9971F",light:"#E8C25E",glow:"rgba(201,151,31,0.28)",icon:Yt,label:"Legendary"},Titan:{color:"#1A8A7A",light:"#3DBFAA",glow:"rgba(26,138,122,0.28)",icon:pa,label:"Titan"}},mh={"Safe Storage":"data:imag         .mapCallout__empty { font-size:11.5px; color:#7091A0; margin:0; }
